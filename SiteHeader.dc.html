<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div>
  <div style="background:oklch(30% 0.11 258); color:oklch(96% 0.01 258); font-size:13px; padding:8px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
    <div style="display:flex; gap:20px; flex-wrap:wrap;">
      <span>Call <a href="tel:+918860977444" style="color:inherit; font-weight:700;">088609 77444</a></span>
      <span style="opacity:0.85;">Open · Closes 7 PM</span>
    </div>
    <div style="opacity:0.9;" class="topbar-addr">Fusion Homes, Tech Zone IV, Greater Noida W Rd, Noida 201318</div>
  </div>

  <header style="position:sticky; top:0; z-index:50; background:oklch(100% 0 0 / 0.94); backdrop-filter:blur(8px); border-bottom:1px solid oklch(90% 0.01 260); display:flex; align-items:center; justify-content:space-between; gap:20px; padding:12px 20px; flex-wrap:nowrap;">
    <a href="index.html" style="display:flex; align-items:center; gap:9px; flex-shrink:0; min-width:0;">
      <div style="width:36px; height:36px; border-radius:9px; background:oklch(40% 0.13 258); display:flex; align-items:center; justify-content:center; color:white; font-weight:800; font-size:13px; flex-shrink:0;">TAS</div>
      <div style="line-height:1.1; white-space:nowrap;">
        <div style="font-weight:800; font-size:14.5px; color:oklch(22% 0.02 260); white-space:nowrap;">Tax &amp; Accounting Solutions</div>
        <div style="font-size:10.5px; color:oklch(50% 0.02 260); letter-spacing:0.04em; white-space:nowrap;">GHAZIABAD · NOIDA</div>
      </div>
    </a>
    <nav style="display:flex; align-items:center; gap:15px; flex-wrap:nowrap; flex:1 1 auto; justify-content:flex-end; min-width:0;" class="nav-desktop">
      <a href="about.html" style="color:oklch(30% 0.02 260); font-weight:600; font-size:13.5px; white-space:nowrap;">About Us</a>
      <sc-for list="{{ menuCategories }}" as="cat" hint-placeholder-count="5">
        <div onMouseEnter="{{ cat.open }}" onMouseLeave="{{ cat.close }}" style="position:relative; z-index:80;">
          <div onClick="{{ cat.toggle }}" style="color:oklch(30% 0.02 260); font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:4px; white-space:nowrap; padding:8px 2px; cursor:pointer; user-select:none;" style-hover="color:oklch(40% 0.13 258);">{{ cat.name }} <span style="font-size:9px; display:inline-block; transition:transform 0.15s;">▾</span></div>
          <div style="position:absolute; top:100%; left:50%; transform:translateX(-50%); padding-top:8px; width:230px; display:{{ cat.display }};">
            <div style="position:absolute; top:3px; left:50%; transform:translateX(-50%) rotate(45deg); width:10px; height:10px; background:white; border:1px solid oklch(90% 0.01 260); border-right:none; border-bottom:none;"></div>
            <div style="position:relative; background:white; border:1px solid oklch(90% 0.01 260); border-radius:12px; box-shadow:0 24px 48px -20px oklch(30% 0.02 260 / 0.35); padding:8px; display:flex; flex-direction:column; gap:1px; overflow:hidden;">
              <div style="height:3px; background:{{ cat.accent }}; border-radius:2px; margin:2px 4px 6px;"></div>
              <sc-for list="{{ cat.items }}" as="it" hint-placeholder-count="2">
                <a href="service.html?slug={{ it.slug }}" style="display:block; padding:9px 10px; font-size:13.5px; font-weight:600; color:oklch(28% 0.02 260); border-radius:7px; white-space:nowrap;" style-hover="background:oklch(96% 0.008 75); color:oklch(40% 0.13 258);">{{ it.title }}</a>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-for>
      <a href="index.html#pricing" style="color:oklch(30% 0.02 260); font-weight:600; font-size:13.5px; white-space:nowrap;">Pricing</a>
      <a href="index.html#contact" style="color:oklch(30% 0.02 260); font-weight:600; font-size:13.5px; white-space:nowrap;">Contact</a>
    </nav>
    <div style="display:flex; gap:8px; flex-shrink:0;" class="header-cta">
      <a href="{{ waLink }}" target="_blank" style="background:oklch(58% 0.14 150); color:white; font-weight:700; font-size:12.5px; padding:9px 14px; border-radius:8px; display:flex; align-items:center; white-space:nowrap;">WhatsApp</a>
      <a href="tel:+918860977444" style="background:oklch(40% 0.13 258); color:white; font-weight:700; font-size:12.5px; padding:9px 14px; border-radius:8px; display:flex; align-items:center; white-space:nowrap;">Call Now</a>
    </div>
    <div onClick="{{ toggleMobile }}" class="hamburger" style="width:44px; height:44px; border-radius:9px; border:1px solid oklch(88% 0.01 260); align-items:center; justify-content:center; flex-direction:column; gap:4px; cursor:pointer; flex-shrink:0;">
      <div style="width:18px; height:2px; background:oklch(30% 0.02 260); border-radius:2px;"></div>
      <div style="width:18px; height:2px; background:oklch(30% 0.02 260); border-radius:2px;"></div>
      <div style="width:18px; height:2px; background:oklch(30% 0.02 260); border-radius:2px;"></div>
    </div>
  </header>

  <div style="display:{{ mobileDisplay }}; position:relative; z-index:49; background:white; border-bottom:1px solid oklch(90% 0.01 260); box-shadow:0 24px 36px -24px oklch(30% 0.02 260 / 0.4); padding:6px 18px 16px; max-height:calc(100vh - 110px); overflow-y:auto;">
    <a href="about.html" style="display:flex; align-items:center; height:46px; font-size:14.5px; font-weight:700; color:oklch(25% 0.02 260); border-bottom:1px solid oklch(94% 0.01 260);">About Us</a>
    <sc-for list="{{ menuCategories }}" as="cat" hint-placeholder-count="5">
      <div style="border-bottom:1px solid oklch(94% 0.01 260);">
        <div onClick="{{ cat.toggleMobileCat }}" style="display:flex; align-items:center; justify-content:space-between; height:46px; cursor:pointer; user-select:none;">
          <div style="display:flex; align-items:center; gap:9px;">
            <div style="width:12px; height:3px; border-radius:2px; background:{{ cat.accent }};"></div>
            <div style="font-size:14.5px; font-weight:700; color:oklch(25% 0.02 260);">{{ cat.name }}</div>
          </div>
          <div style="font-size:11px; color:oklch(50% 0.02 260); transform:{{ cat.caret }};">▾</div>
        </div>
        <div style="display:{{ cat.mobileDisplay }}; padding:0 0 8px 21px;">
          <sc-for list="{{ cat.items }}" as="it" hint-placeholder-count="2">
            <a href="service.html?slug={{ it.slug }}" style="display:flex; align-items:center; min-height:42px; font-size:14px; font-weight:600; color:oklch(35% 0.02 260);">{{ it.title }}</a>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <a href="index.html#pricing" style="display:flex; align-items:center; height:46px; font-size:14.5px; font-weight:700; color:oklch(25% 0.02 260); border-bottom:1px solid oklch(94% 0.01 260);">Pricing</a>
    <a href="index.html#contact" style="display:flex; align-items:center; height:46px; font-size:14.5px; font-weight:700; color:oklch(25% 0.02 260);">Contact</a>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <a href="{{ waLink }}" target="_blank" style="flex:1; text-align:center; background:oklch(58% 0.14 150); color:white; font-weight:700; font-size:14px; padding:13px; border-radius:9px;">WhatsApp</a>
      <a href="tel:+918860977444" style="flex:1; text-align:center; background:oklch(40% 0.13 258); color:white; font-weight:700; font-size:14px; padding:13px; border-radius:9px;">Call Now</a>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { openMenu: null, mobileOpen: false, mobileCat: null };

  toggleMenu = (slug) => (e) => {
    e.preventDefault();
    this.setState(s => ({ openMenu: s.openMenu === slug ? null : slug }));
  };
  toggleMobile = () => this.setState(s => ({ mobileOpen: !s.mobileOpen }));
  toggleMobileCat = (slug) => () => this.setState(s => ({ mobileCat: s.mobileCat === slug ? null : slug }));

  renderVals() {
    const cats = [
      { slug: "registration", name: "Registration", accent: "oklch(62% 0.15 55)", items: [
        { slug: "company-registration", title: "Company Registration" },
        { slug: "msme-startup-registration", title: "MSME / Startup Registration" },
        { slug: "trademark-ip", title: "Trademark & IP" },
      ] },
      { slug: "gst", name: "GST", accent: "oklch(40% 0.13 258)", items: [
        { slug: "gst-registration-filing", title: "GST Registration & Filing" },
      ] },
      { slug: "income-tax", name: "Income Tax", accent: "oklch(58% 0.14 150)", items: [
        { slug: "income-tax-itr-filing", title: "Income Tax / ITR Filing" },
        { slug: "tds-filing", title: "TDS Filing" },
      ] },
      { slug: "compliance", name: "Compliance", accent: "oklch(58% 0.14 150)", items: [
        { slug: "tax-notice-assessment", title: "Tax Notice & Assessment" },
        { slug: "auditing", title: "Auditing" },
      ] },
      { slug: "accounting", name: "Accounting", accent: "oklch(62% 0.15 55)", items: [
        { slug: "accounting-bookkeeping", title: "Accounting & Bookkeeping" },
        { slug: "payroll-services", title: "Payroll Services" },
      ] },
    ];
    return {
      waLink: "https://wa.me/918860977444?text=Hello%2C%20I%20need%20help%20with%20GST%2FTax%20services",
      toggleMobile: this.toggleMobile,
      mobileDisplay: this.state.mobileOpen ? "block" : "none",
      menuCategories: cats.map(c => ({
        ...c,
        display: this.state.openMenu === c.slug ? "block" : "none",
        mobileDisplay: this.state.mobileCat === c.slug ? "block" : "none",
        caret: this.state.mobileCat === c.slug ? "rotate(180deg)" : "none",
        toggle: this.toggleMenu(c.slug),
        toggleMobileCat: this.toggleMobileCat(c.slug),
        open: () => this.setState({ openMenu: c.slug }),
        close: () => this.setState(s => (s.openMenu === c.slug ? { openMenu: null } : null)),
      })),
    };
  }
}

</script>
</body>
</html>
